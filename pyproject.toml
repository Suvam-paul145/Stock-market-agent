[project]
name = "stock-research-agent"
version = "0.2.0"
description = "Private stock research data foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "exchange-calendars>=4.11,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a disposable local PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
